<script>
   /* ================= Cassettefy · shared code ================= */
const RED = '#C1272D', DRED = '#9B1B22', TEAL = '#1E6B65', DTEAL = '#174F4A', PINK = '#EE8A83', MUST = '#F2CF6B', PAPER = '#FAF3E0';
const SHELLS = [
  { name: 'Cherry red', shell: RED, stripe: MUST },
  { name: 'Diner teal', shell: TEAL, stripe: PINK },
  { name: 'Mustard', shell: MUST, stripe: TEAL },
  { name: 'Soda pink', shell: PINK, stripe: TEAL },
  { name: 'Night teal', shell: DTEAL, stripe: PINK },
  { name: 'Kraft', shell: '#E4D3A8', stripe: RED }
];
const LIGHT_SHELLS = ['#F2CF6B', '#EE8A83', '#E4D3A8'];
const GENRES = ['Disco', 'Funk', 'Soul', 'Europop', 'Electronic', 'Doo-wop', "Rock 'n' roll", 'Pop', 'Easy listening', 'R&B', 'Jazz', 'Hip-hop'];

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const pad2 = (n) => (n < 10 ? '0' : '') + n;
const durOk = (t) => /^\d{1,3}:[0-5]\d$/.test(String(t || '').trim());
// Function: secs — handles this part of the app.
function secs(t) { const m = /^(\d{1,3}):([0-5]\d)$/.exec(String(t || '').trim()); return m ? +m[1] * 60 + +m[2] : 0; }
// Function: fmt — handles this part of the app.
function fmt(s) {
  s = Math.max(0, Math.round(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  return h ? h + ':' + pad2(m) + ':' + pad2(r) : m + ':' + pad2(r);
}
const tapeSeconds = (tape) => tape.tracks.reduce((a, t) => a + secs(t.time), 0);
const tapeMeta = (tape) => tape.tracks.length + (tape.tracks.length === 1 ? ' track' : ' tracks') + ' · ' + Math.round(tapeSeconds(tape) / 60) + ' min';
const shell2 = (shell) => (LIGHT_SHELLS.includes(shell) ? RED : shell);
const orderTracks = (tape) => tape.tracks.filter((t) => t.side === 'A').concat(tape.tracks.filter((t) => t.side === 'B'));

// Function: timeLabel — handles this part of the app.

function timeLabel(ts) {
  const d = new Date(ts), now = new Date();
  const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(now) - day(d)) / 86400000);
  const clock = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (diff === 0) return 'Today, ' + clock;
  if (diff === 1) return 'Yesterday, ' + clock;
  if (diff < 7) return d.toLocaleDateString([], { weekday: 'long' });
  return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}
// Function: groupLabel — handles this part of the app.
function groupLabel(ts) {
  const d = new Date(ts), now = new Date();
  const day = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day(now) - day(d)) / 86400000);
  return diff === 0 ? 'TODAY' : diff === 1 ? 'YESTERDAY' : diff < 7 ? 'EARLIER THIS WEEK' : 'EARLIER';
}

/* ---------------- storage ----------------
   Tapes (playlists) live on the Node server:  GET/POST /api/playlists, PUT/DELETE /api/playlists/:id
   Per-browser things (recent plays, now playing, recent searches, display name, Spotify token) stay in localStorage.
   If the page is opened without the server (file://, or the server is down) tapes fall back to localStorage too. */
const API = location.protocol === 'file:' ? null : 'api';

// Function: sampleTapes — handles this part of the app.

function sampleTapes() {
  const now = Date.now();
  const tr = (side, title, artist, genre, time) => ({ id: uid(), side, title, artist, genre, time });
  const tape = (name, genre, shellIdx, fav, ageDays, tracks) => ({
    name, genre, notes: '', shell: SHELLS[shellIdx].shell, stripe: SHELLS[shellIdx].stripe,
    fav, likedAt: fav ? now - ageDays * 86400000 : null, createdAt: now - (ageDays + 20) * 86400000, tracks
  });
  return [
    tape('Saturday Night Fever', 'Disco', 0, true, 2, [
      tr('A', "Stayin' Alive", 'Bee Gees', 'Disco', '4:45'), tr('A', 'I Will Survive', 'Gloria Gaynor', 'Disco', '3:18'),
      tr('A', 'September', 'Earth, Wind & Fire', 'Funk', '3:35'), tr('A', 'Le Freak', 'Chic', 'Disco', '3:30'),
      tr('A', 'Dancing Queen', 'ABBA', 'Europop', '3:51'), tr('A', 'Hot Stuff', 'Donna Summer', 'Disco', '3:47'),
      tr('B', 'Night Fever', 'Bee Gees', 'Disco', '3:33'), tr('B', 'Good Times', 'Chic', 'Funk', '3:36'),
      tr('B', 'I Feel Love', 'Donna Summer', 'Electronic', '5:53'), tr('B', 'Boogie Wonderland', 'Earth, Wind & Fire', 'Funk', '4:48'),
      tr('B', 'Funkytown', 'Lipps Inc.', 'Disco', '3:59'), tr('B', "Don't Leave Me This Way", 'Thelma Houston', 'Soul', '3:38')]),
    tape('Soda Fountain Sundays', "Doo-wop & '50s pop", 1, false, 9, [
      tr('A', 'Earth Angel', 'The Penguins', 'Doo-wop', '2:58'), tr('A', 'In the Still of the Night', 'The Five Satins', 'Doo-wop', '3:03'),
      tr('B', 'Only You', 'The Platters', 'Doo-wop', '2:39'), tr('B', 'Sh-Boom', 'The Chords', 'Doo-wop', '2:30')]),
    tape("Roller Rink '79", 'Funk & roller disco', 2, false, 12, [
      tr('A', 'Car Wash', 'Rose Royce', 'Funk', '3:18'), tr('A', 'Get Down Tonight', 'KC and the Sunshine Band', 'Disco', '3:15'),
      tr('B', 'Boogie Oogie Oogie', 'A Taste of Honey', 'Disco', '3:40'), tr('B', "Ladies' Night", 'Kool & the Gang', 'Funk', '3:32')]),
    tape('Diner Jukebox', "Rock 'n' roll", 3, true, 7, [
      tr('A', 'Johnny B. Goode', 'Chuck Berry', "Rock 'n' roll", '2:41'), tr('A', 'Rock Around the Clock', 'Bill Haley & His Comets', "Rock 'n' roll", '2:10'),
      tr('B', 'Blue Suede Shoes', 'Carl Perkins', "Rock 'n' roll", '2:15'), tr('B', 'Great Balls of Fire', 'Jerry Lee Lewis', "Rock 'n' roll", '1:52')]),
    tape('Late Night Drive', 'Soul & slow jams', 4, true, 30, [
      tr('A', "Let's Stay Together", 'Al Green', 'Soul', '3:18'), tr('A', "Ain't No Sunshine", 'Bill Withers', 'Soul', '2:05'),
      tr('B', "What's Going On", 'Marvin Gaye', 'Soul', '3:53')]),
    tape('Sunday Morning Records', 'Easy listening', 5, false, 15, [
      tr('A', "(Sittin' On) The Dock of the Bay", 'Otis Redding', 'Soul', '2:42'), tr('A', '(They Long to Be) Close to You', 'Carpenters', 'Pop', '3:40'),
      tr('B', "Everybody's Talkin'", 'Harry Nilsson', 'Pop', '2:45')])
  ];
}

/** Accepts playlists saved by older versions of the server (e.g. {title, songs}) and fills in what the UI needs. */
// Function: normalizeTape — handles this part of the app.
function normalizeTape(p) {
  p = p || {};
  const key = String(p.id == null ? uid() : p.id);
  let h = 0; for (const c of key) h = (h * 31 + c.charCodeAt(0)) | 0;
  const s = SHELLS[Math.abs(h) % SHELLS.length];
  const raw = Array.isArray(p.tracks) ? p.tracks : Array.isArray(p.songs) ? p.songs : [];
  const half = Math.ceil(raw.length / 2);
  const tracks = raw.map((t, i) => {
    t = t || {};
    let time = t.time || '';
    if (!time && t.durationMs) time = fmt(t.durationMs / 1000);
    if (!time && t.duration != null) time = typeof t.duration === 'number' ? fmt(t.duration) : String(t.duration);
    return { id: String(t.id == null ? uid() : t.id), side: t.side === 'A' || t.side === 'B' ? t.side : i < half ? 'A' : 'B',
      title: t.title || t.name || t.trackName || 'Untitled', artist: t.artist || t.artistName || '', genre: t.genre || '',
      time, previewUrl: t.previewUrl || '', spotifyUri: t.spotifyUri || '', art: t.art || t.artwork || '' };
  });
  const out = Object.assign({}, p, {
    id: key, name: p.name || p.title || 'Untitled tape', genre: p.genre || 'Mixed', notes: p.notes || p.description || '',
    shell: p.shell || s.shell, stripe: p.stripe || s.stripe, fav: !!p.fav, likedAt: p.likedAt || null,
    createdAt: p.createdAt || (typeof p.id === 'number' ? p.id : Date.now()), tracks
  });
  delete out.songs;
  return out;
}

// Data store: loads, saves, and manages tapes, playlists, profile data, and history.
const Store = (() => {
  const KEY = 'cassettefy.v2';          // per-browser state
  const TAPES_KEY = 'cassettefy.tapes';  // tapes, only used when the server can't be reached
  const readJSON = (k) => { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : null; } catch (e) { return null; } };
  const writeJSON = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* private mode: keep in memory */ } };
  const defaults = () => ({ profile: { name: 'Guest listener' }, recent: [], now: null, searches: ['Bee Gees', 'Donna Summer', 'ABBA', 'doo-wop'], spotify: null });

  let data = Object.assign(defaults(), readJSON(KEY) || {}, { playlists: [] });
  let online = false;
  const synced = new Map(); // tape id -> JSON last saved to the server
  let timer = null;

  const toServer = (t) => { const c = Object.assign({}, t); delete c.id; return c; };
  const snap = (t) => JSON.stringify(toServer(t));
  const sortTapes = () => data.playlists.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
  // Function: writeLocal — handles this part of the app.
  function writeLocal() {
    const local = Object.assign({}, data); delete local.playlists;
    writeJSON(KEY, local);
    if (!online) writeJSON(TAPES_KEY, data.playlists);
  }
  // Function: api — handles this part of the app.
  async function api(method, path, body) {
    const r = await fetch(API + path, { method, keepalive: method !== 'GET' && !!body && JSON.stringify(body).length < 60000, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
    if (!r.ok) throw new Error(method + ' ' + path + ' → ' + r.status);
    const text = await r.text();
    return text ? JSON.parse(text) : null;
  }
  // Function: load — handles this part of the app.
  async function load() {
    const list = await api('GET', '/playlists');
    data.playlists = (Array.isArray(list) ? list : []).map(normalizeTape);
    synced.clear(); data.playlists.forEach((t) => synced.set(t.id, snap(t)));
    sortTapes();
  }
  // Function: syncNow — handles this part of the app.
  async function syncNow() {
    clearTimeout(timer);
    if (!online) return;
    for (const t of data.playlists.slice()) {
      const s = snap(t);
      if (synced.get(t.id) === s) continue;
      synced.set(t.id, s);
      try { await api('PUT', '/playlists/' + encodeURIComponent(t.id), toServer(t)); }
      catch (e) { synced.delete(t.id); toast('Couldn’t save “' + t.name + '” to the server. Is it still running?'); }
    }
  }
  window.addEventListener('pagehide', () => { if (online) syncNow(); });

  return {
    get data() { return data; },
    get online() { return online; },
    async init() {
      if (API) { try { await load(); online = true; } catch (e) { online = false; } }
      if (!online) { data.playlists = (readJSON(TAPES_KEY) || []).map(normalizeTape); sortTapes(); }
      return online;
    },
    /** Saves per-browser state now and pushes any changed tapes to the server (debounced). */
    save() { writeLocal(); clearTimeout(timer); timer = setTimeout(syncNow, 250); },
    flush: syncNow,
    reload() { const d = readJSON(KEY); if (d) Object.assign(data, d, { playlists: data.playlists }); },
    async refresh() {
      if (!online) return;
      try { await syncNow(); await load(); } catch (e) { /* keep what we have */ }
    },
    tape(id) { return id == null ? null : data.playlists.find((p) => p.id === String(id)) || null; },
    tapeNo(tape) { const asc = data.playlists.slice().sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)); return asc.indexOf(tape) + 1; },
    async addTape(t) {
      if (online) {
        const saved = normalizeTape(await api('POST', '/playlists', toServer(t)));
        data.playlists.unshift(saved); synced.set(saved.id, snap(saved)); sortTapes(); writeLocal();
        return saved;
      }
      const local = normalizeTape(Object.assign({ id: uid() }, t));
      data.playlists.unshift(local); sortTapes(); writeLocal();
      return local;
    },
    async removeTape(id) {
      id = String(id);
      if (online) await api('DELETE', '/playlists/' + encodeURIComponent(id));
      data.playlists = data.playlists.filter((p) => p.id !== id);
      data.recent = data.recent.filter((r) => r.playlistId !== id);
      if (data.now && data.now.playlistId === id) data.now = null;
      synced.delete(id); writeLocal();
    },
    async loadSamples() {
      for (const t of sampleTapes()) await this.addTape(t);
    },
    logPlay(playlistId, trackId, position, done) {
      data.recent = [{ playlistId, trackId, position: Math.floor(position || 0), at: Date.now(), done: !!done }]
        .concat(data.recent.filter((r) => r.playlistId !== playlistId)).slice(0, 40);
      writeLocal();
    },
    newTape(fields) {
      const s = SHELLS[fields.shellIdx || 0];
      return { name: fields.name || 'Untitled tape', genre: fields.genre || 'Mixed', notes: fields.notes || '',

    '<div class="r-c"><div class="display" style="font-size: 20px; color: #C1272D; letter-spacing: .04em;">' + star + ' CASSETTEFY TAPE CO. ' + star + '</div>' +
    '<div style="font-size: 14px; letter-spacing: .12em; margin-top: 4px;">MIXTAPE RECEIPT</div>' +
    '<div style="font-size: 14px; margin-top: 2px;">TAPE No. ' + no + ' · C-60 CASSETTE</div><div style="font-size: 14px;">' + esc(date) + '</div></div>' +
    '<div class="r-rule"></div>' +
    '<div class="r-namebox">' + (tape.fav ? '<div class="stamp" aria-label="Favorite tape">' + icon('heartf', 20) + 'TOP<br>SHELF</div>' : '') +
    '<div style="font-size: 20px; font-weight: 700; text-transform: uppercase; line-height: 1.2; padding: 0 ' + (tape.fav ? '96px' : '6px') + ' 0 6px;">' + esc(tape.name) + '</div>' +
    '<div style="font-size: 14px; padding: 2px 6px 0; text-transform: uppercase;">GENRE: ' + esc(tape.genre || '—') + '</div></div>' +
    '<div class="r-rule"></div><div class="r-head"><span>#</span><span>ITEM</span><span style="text-align: right;">TIME</span><span></span></div>' +
    '<div class="r-side">&#8212; SIDE A &#8212;</div>' + side(A) + '<div class="r-side">&#8212; SIDE B &#8212;</div>' + side(B) +
    '<div class="r-rule"></div>' +
    '<div class="r-line"><span>SUBTOTAL SIDE A</span><span class="r-time">' + fmt(sum(A)) + '</span></div>' +
    '<div class="r-line"><span>SUBTOTAL SIDE B</span><span class="r-time">' + fmt(sum(B)) + '</span></div>' +
    '<div class="r-rule dbl"></div><div class="r-line"><span>TRACKS</span><span class="r-time">' + tape.tracks.length + '</span></div>' +
    '<div class="r-line" style="font-size: 20px; font-weight: 700; background: linear-gradient(transparent 55%, #FF9ED2 55%);"><span>TOTAL TIME</span><span class="r-time">' + fmt(sum(A) + sum(B)) + '</span></div>' +
    '<div class="r-rule"></div><div class="barcode" aria-hidden="true"></div>' +
    '<div class="r-c" style="font-size: 13px; letter-spacing: .1em;">*** ' + esc(opts.note || 'CLICK ANY LINE TO EDIT IT') + ' ***</div>' +
    '<div class="r-c" style="font-size: 12px; margin-top: 4px; color: #6B5A48;">KEEP THIS RECEIPT · PLAY IT LOUD</div></div>';
}

/* ---------------- small UI helpers ---------------- */
// Function: toast — handles this part of the app.
function toast(msg) {
  const el = $('#toast'); if (!el) return;
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('show'), 2800);
}
/** Two-step confirm for destructive buttons (no browser dialogs). */
// Function: confirmClick — handles this part of the app.
function confirmClick(btn, label, action) {
  if (btn.dataset.armed === '1') { action(); return; }
  btn.dataset.armed = '1'; btn.dataset.orig = btn.innerHTML; btn.classList.add('armed'); btn.textContent = label;
  setTimeout(() => { if (btn.isConnected && btn.dataset.armed === '1') { btn.dataset.armed = ''; btn.classList.remove('armed'); btn.innerHTML = btn.dataset.orig; } }, 3500);
}
/** Fills the sidebar mini player + tablet/phone dock with the current track. */
// Function: paintNowPlaying — handles this part of the app.
function paintNowPlaying(info) {
  const t = info && info.track, tape = info && info.tape;
  $$('[data-np="title"]').forEach((e) => (e.textContent = t ? t.title : 'Nothing playing'));
  $$('[data-np="artist"]').forEach((e) => (e.textContent = t ? t.artist : 'Load a tape in the deck'));
  $$('[data-np="sub"]').forEach((e) => (e.textContent = t ? t.artist + ' · ' + tape.name : 'Load a tape in the deck'));
  $$('[data-np="elapsed"]').forEach((e) => (e.textContent = fmt(info ? info.pos : 0)));
  $$('[data-np="total"]').forEach((e) => (e.textContent = fmt(info ? info.dur : 0)));
  $$('[data-np="fill"]').forEach((e) => (e.style.width = (info && info.dur ? Math.min(100, (info.pos / info.dur) * 100) : 0) + '%'));
  $$('[data-np="tape"]').forEach((e) => (e.innerHTML = miniTape(e.dataset.w || 58, tape ? tape.shell : RED, tape ? tape.stripe : MUST)));
  $$('[data-np="play"]').forEach((b) => { b.innerHTML = icon(info && info.playing ? 'pause' : 'play', 22); b.setAttribute('aria-label', info && info.playing ? 'Pause' : 'Play'); });
}
const Player = {
  tape: null, idx: 0, playing: false, pos: 0, timer: null,
  order() { return this.tape ? orderTracks(this.tape) : []; },
  track() { return this.order()[this.idx] || null; },
  usesAudio() { const t = this.track(); return !!(t && t.previewUrl); },
  dur() {
    const t = this.track(); if (!t) return 0;
    if (t.previewUrl && isFinite(deckAudio.duration) && deckAudio.duration > 0) return deckAudio.duration;
    return secs(t.time) || (t.previewUrl ? 30 : 0);
  },
  load(tapeId, trackId, pos, autoplay) {
    const tape = Store.tape(tapeId); if (!tape) return;
    this.halt();
    this.tape = tape;
    const i = trackId ? this.order().findIndex((t) => t.id === trackId) : 0;
    this.idx = Math.max(0, i); this.pos = pos || 0;
    this.cue(); this.persist(false);
    if (autoplay) this.play(); else ui();
  },
  cue() {
    const t = this.track();
    if (t && t.previewUrl) {
      if (deckAudio.getAttribute('src') !== t.previewUrl) deckAudio.src = t.previewUrl;
      try { deckAudio.currentTime = Math.min(this.pos, 29); } catch (e) { /* not loaded yet */ }
    } else { deckAudio.removeAttribute('src'); }
  },
  play() {
    const t = this.track();
    if (!this.tape) { toast('Load a tape in the deck first.'); return; }
    if (!t) { toast('This tape is blank. Add songs from Search or the editor.'); return; }
    previewAudio.pause(); stopPreviewButtons();
    this.playing = true;
    clearInterval(this.timer);
    if (this.usesAudio()) {
      deckAudio.play().catch(() => this.simulate());
    } else this.simulate();
    Store.logPlay(this.tape.id, t.id, this.pos);
    ui();
  },
  simulate() {
    // Songs typed in by hand have no audio, so the deck counts through their duration.
    clearInterval(this.timer);
    this.timer = setInterval(() => {
      if (!this.playing) return;
      this.pos += 1;
      if (this.pos >= this.dur()) this.next(true);
      else { tick(); if (Math.floor(this.pos) % 10 === 0) this.persist(false); }
    }, 1000);
  },
  pause() { this.playing = false; clearInterval(this.timer); deckAudio.pause(); this.persist(true); ui(); },
  toggle() { this.playing ? this.pause() : this.play(); },
  halt() { this.playing = false; clearInterval(this.timer); deckAudio.pause(); },
  stop() { this.halt(); this.pos = 0; try { deckAudio.currentTime = 0; } catch (e) {} this.persist(true); ui(); },
  go(i, play) {
    const n = this.order().length; if (!n) return;
    const keep = play || this.playing;
    this.halt(); this.idx = (i + n) % n; this.pos = 0; this.cue(); this.persist(false);
    if (keep) this.play(); else ui();
  },
  next(auto) {
    const n = this.order().length;
    if (auto && this.idx >= n - 1) {
      this.halt(); this.pos = 0;
      if (this.track()) Store.logPlay(this.tape.id, this.track().id, 0, true);
      toast('End of the tape. Flip it or pick another.'); ui(); return;
    }
    this.go(this.idx + 1, auto);
  },
  prev() { if (this.pos > 3) this.seek(0); else this.go(this.idx - 1); },
  flip() {
    const cur = this.track(); if (!cur) return;
    const i = this.order().findIndex((t) => t.side !== cur.side);
    if (i < 0) { toast('Side ' + (cur.side === 'A' ? 'B' : 'A') + ' is blank.'); return; }
    this.go(i);
  },
  seek(s) {
    this.pos = Math.max(0, Math.min(s, this.dur()));
    if (this.usesAudio()) { try { deckAudio.currentTime = this.pos; } catch (e) {} }
    tick(); this.persist(false);
  },
  persist(log) {
    if (!this.tape) return;
    const t = this.track();
    Store.data.now = { playlistId: this.tape.id, trackId: t ? t.id : null, position: Math.floor(this.pos) };
    if (log && t) Store.logPlay(this.tape.id, t.id, this.pos); else Store.save();
  },
  info() { return this.tape ? { tape: this.tape, track: this.track(), pos: this.pos, dur: this.dur(), playing: this.playing } : null; }
};
deckAudio.addEventListener('timeupdate', () => { if (Player.usesAudio()) { Player.pos = deckAudio.currentTime; tick(); } });
deckAudio.addEventListener('loadedmetadata', tick);
deckAudio.addEventListener('ended', () => Player.next(true));

// Playback UI update: synchronizes progress, elapsed time, and player indicators.
// Function: tick — handles this part of the app.
function tick() {
  const info = Player.info();
  paintNowPlaying(info);
  if (!info) return;
  const pct = info.dur ? Math.min(100, (info.pos / info.dur) * 100) : 0;
  const fill = $('#progFill'); if (fill) fill.style.width = pct + '%';
  $$('[data-deck="elapsed"]').forEach((e) => (e.textContent = fmt(info.pos)));
  const tot = $('#progTotal'); if (tot) tot.textContent = fmt(info.dur);
  const bar = $('#progress'); if (bar) { bar.setAttribute('aria-valuenow', Math.round(info.pos)); bar.setAttribute('aria-valuemax', Math.round(info.dur)); bar.setAttribute('aria-valuetext', fmt(info.pos) + ' of ' + fmt(info.dur)); }
}
// Player UI bindings: connects playback buttons to the Player controller.
// Function: ui — handles this part of the app.
function ui() {
  tick();
  if (currentRoute === 'deck') renderDeck();
  if (!Player.info()) paintNowPlaying(null);
}
$$('[data-np="play"]').forEach((b) => b.addEventListener('click', () => (Player.tape ? Player.toggle() : (location.hash = '#deck'))));
$$('[data-np="prev"]').forEach((b) => b.addEventListener('click', () => Player.prev()));
$$('[data-np="next"]').forEach((b) => b.addEventListener('click', () => Player.go(Player.idx + 1)));

/* The dedicated editor page has no search preview buttons. */
function stopPreviewButtons() {}

/* ======================= EDIT MIXTAPE ======================= */
const STRIPES = [
  { name: 'Mustard', color: MUST }, { name: 'Soda pink', color: PINK }, { name: 'Diner teal', color: TEAL },
  { name: 'Cherry red', color: RED }, { name: 'Night teal', color: DTEAL }, { name: 'Paper', color: PAPER }
];
// Editor state: manages the currently edited tape and its draft metadata.
const E = {
  id: null,          // tape being edited
  draft: null,       // customize fields not saved yet, shown live on the preview tape
  tape() { return Store.tape(this.id); },
  /** Opens a tape in the editor. `fresh` drops unsaved changes, e.g. when arriving from another page. */
  open(id, fresh) {
    if (id === this.id && !fresh) return;
    this.id = id || null; this.draft = null;
  }
};
/** After a tape's songs change, keeps the deck on the song it was on, or stops if that song is gone. */
// Function: keepPlayerOn — handles this part of the app.
function keepPlayerOn(tape, trackId) {
  if (Player.tape !== tape) return;
  const i = Player.order().findIndex((t) => t.id === trackId);
  if (i >= 0) { Player.idx = i; return; }
  Player.halt(); Player.idx = Math.min(Player.idx, Math.max(0, Player.order().length - 1)); Player.pos = 0;
  Player.cue(); Player.persist(false); ui();
}
const playingTrackId = (tape) => (Player.tape === tape && Player.track() ? Player.track().id : null);
// Editor renderer: builds the mixtape editor and song list.
// Function: renderEdit — handles this part of the app.
function renderEdit() {
  const tape = E.tape();
  $('#edEmpty').hidden = !!tape; $('#edMain').hidden = !tape; $('#edPlay').hidden = !tape;
  if (!tape) { $('#edTag').textContent = 'In the workshop'; return; }
  if (!E.draft) {
    E.draft = { name: tape.name, notes: tape.notes, genre: tape.genre, shell: tape.shell, stripe: tape.stripe };
    $('#edName').value = tape.name; $('#edNotes').value = tape.notes || ''; $('#edGenre').value = tape.genre || '';
  }
  $('#edTag').textContent = tapeMeta(tape);
  $('#edPlay').dataset.play = tape.id; $('#edPlay').href = 'index.html?play=' + encodeURIComponent(tape.id) + '#deck';
  $('#edSongsBtn').textContent = 'Edit songs (' + tape.tracks.length + ')';
  renderEditPreview();
  if (!$('#songsOverlay').hidden) renderSongs();
}
// Function: renderEditPreview — handles this part of the app.
function renderEditPreview() {
  const d = E.draft;
  $('#edTape').innerHTML = tapeHTML(Object.assign({}, d, { name: d.name.trim() || 'Untitled tape' }), { box: 'max-width: 540px; margin: 0 auto;' });
  $('#edShells').innerHTML = SHELLS.map((s, i) => '<button type="button" class="swatch" data-shell="' + i + '" aria-label="' + s.name + ' shell" aria-pressed="' + (d.shell === s.shell) + '" style="background: ' + s.shell + ';"></button>').join('');
  $('#edStripes').innerHTML = STRIPES.map((s, i) => '<button type="button" class="swatch" data-stripe="' + i + '" aria-label="' + s.name + ' stripe" aria-pressed="' + (d.stripe === s.color) + '" style="background: ' + s.color + ';"></button>').join('');
}
$('#edTapeForm').addEventListener('input', () => {
  if (!E.draft) return;
  Object.assign(E.draft, { name: $('#edName').value, notes: $('#edNotes').value, genre: $('#edGenre').value });
  renderEditPreview();
});
$('#edShells').addEventListener('click', (e) => {
  const b = e.target.closest('[data-shell]'); if (!b || !E.draft) return;
  const s = SHELLS[+b.dataset.shell]; E.draft.shell = s.shell; E.draft.stripe = s.stripe;
  renderEditPreview(); $('#edShells [data-shell="' + b.dataset.shell + '"]').focus();
});
$('#edStripes').addEventListener('click', (e) => {
  const b = e.target.closest('[data-stripe]'); if (!b || !E.draft) return;
  E.draft.stripe = STRIPES[+b.dataset.stripe].color;
  renderEditPreview(); $('#edStripes [data-stripe="' + b.dataset.stripe + '"]').focus();
});
$('#edTapeForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const tape = E.tape(); if (!tape || !E.draft) return;
  const name = $('#edName').value.trim();
  if (!name) { toast('Give your tape a name first.'); $('#edName').focus(); return; }
  Object.assign(tape, { name, notes: $('#edNotes').value.trim(), genre: $('#edGenre').value.trim() || 'Mixed', shell: E.draft.shell, stripe: E.draft.stripe });
  E.draft = null; Store.save();
  toast('“' + name + '” saved.'); renderEdit(); tick();
});
/* ---------- Edit songs popup: the tape's receipt with a remove button on each song ---------- */
function renderSongs() {
  const tape = E.tape();
  if (!tape) { closeSongs(); return; }
  $('#songsReceipt').innerHTML = receiptHTML(tape, { trash: true, note: 'ADD SONGS FROM THE SEARCH PAGE' });
}
function openSongs() {
  if (!E.tape()) return;
  renderSongs();
  $('#songsOverlay').hidden = false;
  $('#songsClose').focus();
}
function closeSongs() {
  $('#songsOverlay').hidden = true;
  $('#edSongsBtn').focus();
}
$('#edSongsBtn').addEventListener('click', openSongs);
$('#songsClose').addEventListener('click', closeSongs);
// Clicking the dimmed area around the popup, or pressing Esc, closes it too.
$('#songsOverlay').addEventListener('click', (e) => { if (e.target === e.currentTarget) closeSongs(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#songsOverlay').hidden) closeSongs(); });
$('#songsReceipt').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-remove]'); if (!btn) return;
  // Two clicks, like erasing a tape: the first turns the button into "Remove?".
  confirmClick(btn, 'Remove?', () => {
    const tape = E.tape(), t = tape && tape.tracks.find((x) => x.id === btn.dataset.remove); if (!t) return;
    const playing = playingTrackId(tape);
    tape.tracks.splice(tape.tracks.indexOf(t), 1);
    keepPlayerOn(tape, playing);
    // Lets index.html stop the song if it's the one playing in the deck.
    window.parent.postMessage({ type: 'cassettefy-track-deleted', tapeId: tape.id, trackId: t.id }, '*');
    Store.save(); toast('“' + t.title + '” removed.'); renderEdit(); tick();
  });
});

/* ---------- Add songs from Search ---------- */
// Lets index.html wait for this page's last save before it reloads the tapes.
window.cassettefyFlush = () => Store.flush();
$('#edAddSongs').addEventListener('click', async () => {
  const tape = E.tape(); if (!tape) return;
  await Store.flush();
  if (window.parent !== window) {
    // Inside the popup: index.html closes the editor and opens Search with this tape ticked.
    window.parent.postMessage({ type: 'cassettefy-add-songs', id: tape.id, name: tape.name }, '*');
  } else {
    location.href = 'index.html?addto=' + encodeURIComponent(tape.id);
  }
});

/* ======================= edit.html boot ======================= */

// Detect when this editor is being shown inside the index.html popup.
const EMBEDDED_EDITOR = new URLSearchParams(location.search).get('embedded') === '1';
if (EMBEDDED_EDITOR) document.documentElement.classList.add('embedded-editor');

// Close the editor through index.html when this page is inside the popup iframe.
// The direct parent call is the primary method; postMessage is kept as a safe
// fallback so the controls continue working even if the parent implementation changes.
function closeEditorFromParent(){
  if(window.parent === window) return false;

  try{
    if(typeof window.parent.closeEditorDialog === 'function'){
      window.parent.closeEditorDialog(true);
      return true;
    }
  }catch(err){
    // Fall through to postMessage when direct parent access is unavailable.
  }

  try{
    window.parent.postMessage({ type:'cassettefy-close-editor' }, '*');
    return true;
  }catch(err){
    return false;
  }
}

// Back to Library: closes the centered popup and reveals index.html again.
$('#edBack').addEventListener('click',(e)=>{
  if(closeEditorFromParent()) e.preventDefault();
});

// X button: behaves exactly like Back to Library.
$('.dialog-close').addEventListener('click',(e)=>{
  e.preventDefault();

  // X only closes the editor. It must leave the underlying page on the Deck view.
  if(window.parent !== window){
    try{
      if(typeof window.parent.closeEditorDialog === 'function'){
        window.parent.closeEditorDialog(false);
        return;
      }
    }catch(err){
      // Use the message fallback below.
    }

    try{
      window.parent.postMessage({ type:'cassettefy-close-editor', stayDeck:true }, '*');
      return;
    }catch(err){
      // Ignore and use the normal link when opened as a standalone page.
    }
  }

  // Standalone edit.html fallback: return directly to the Deck view.
  location.href='index.html#deck';
});

// Play in deck: close the popup first, then let index.html handle playback.
$('#edPlay').addEventListener('click',(e)=>{
  if(window.parent !== window){
    e.preventDefault();
    const id=E.tape()?.id || '';

    try{
      if(typeof window.parent.closeEditorDialog === 'function'){
        window.parent.closeEditorDialog(false);
        window.parent.location.hash='#deck';
        if(id && window.parent.Player && typeof window.parent.Player.load === 'function'){
          window.parent.Player.load(id,null,0,false);
        }
        if(typeof window.parent.route === 'function') window.parent.route();
        return;
      }
    }catch(err){
      // Use postMessage fallback below.
    }

    window.parent.postMessage({ type:'cassettefy-play-tape', id }, '*');
  }
});

let currentRoute = 'edit';

// Open the requested tape from ?id=... and render the editor.
(async function bootEditor() {
  const online = await Store.init();
  if (!online && API) toast('Can’t reach the server — working offline in this browser.');

  const params = new URLSearchParams(location.search);
  const id = params.get('id') || '';
  E.open(id, true);
  renderEdit();
  tick();
})();
