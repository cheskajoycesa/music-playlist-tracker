<!--Google Fonts used by the retro look: Alfa Slab One (headings), Zilla Slab (text), Yellowtail (script).-->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&amp;family=Yellowtail&amp;family=Zilla+Slab:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!--Shared stylesheet; the editor's own rules are in its "Editor popup (edit.html)" section.-->
<link href="css/style.css" rel="stylesheet" />
</head>
<!--The editor popup. index.html shows this page inside an iframe (edit.html?id=<tape id>&embedded=1);
    it can also be opened on its own as edit.html?id=<tape id>.-->
<body class="edit-page">
<div class="shell paper">
<div class="app">
<main class="main" id="content" tabindex="-1">
<section class="view" id="view-edit">
<div class="edit-dialog" role="dialog" aria-modal="true" aria-labelledby="editDialogTitle">
<!-- Header: song count and length, title, and the Back / Play in deck / close buttons. -->
<div class="pagehead">
<div style="display: flex; flex-direction: column; gap: 8px; min-width: 0;">
<span class="tag" id="edTag">In the workshop</span>
<h1 class="h1" id="editDialogTitle">EDIT MIXTAPE</h1>
<div class="sub">customize the shell, then fill in the songs</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px;">
<a class="btn-outline" href="index.html#library" id="edBack">Back to library</a>
<a class="btn-outline" href="index.html#deck" id="edPlay">Play in deck</a>
<a class="dialog-close" href="index.html#deck" aria-label="Close editor and stay in deck">×</a>
</div>
</div>
<!-- Shown instead of the editor when no tape id was given. -->
<div class="empty-box" id="edEmpty">
          No tape chosen. Open one with the pencil button on a tape in your Library.
        </div>
<section class="split" id="edMain">
<!-- Left column: a live preview of the cassette, which changes as the form is edited. -->
<div style="display: flex; flex-direction: column; gap: 24px; min-width: 0;">
<div style="background: #174F4A; border-radius: 22px; padding: 22px 22px 26px;">
<div id="edTape"></div>
</div>
<!-- Songs are added from the Search page; this popup only lists and removes them. -->
<div class="ed-song-actions">
<button class="btn-ribbon" id="edAddSongs" type="button">Add songs from Search</button>
<button class="btn-outline" id="edSongsBtn" type="button">Edit songs</button>
</div>
</div>
<!-- Right column: the Customize form (name, liner notes, genre, shell color, label stripe). -->
<div style="display: flex; flex-direction: column; gap: 28px; min-width: 0;">
<aside aria-label="Customize this tape" class="editor">
<div class="ed-tab display">CUSTOMIZE</div>
<form class="ed-body" id="edTapeForm">
<label class="ed-l">
                  Tape name
                  <input class="field" id="edName" maxlength="60" required="" type="text"/>
</label>
<label class="ed-l">
                  Liner notes
                  <textarea class="field" id="edNotes" placeholder="What's this tape for?" rows="2"></textarea>
</label>
<label class="ed-l">
                  Genre
                  <!-- A dropdown, not a text box: the options are filled in by fillGenreSelect() in the script. -->
                  <select class="field genre-select" id="edGenre"></select>
</label>
<fieldset style="border: 0; margin: 0; padding: 0;">
<legend style="font-size: 16px; font-weight: 600; margin-bottom: 10px;">Shell color</legend>
<div id="edShells" style="display: flex; flex-wrap: wrap; gap: 12px; padding-left: 4px;"></div>
</fieldset>
<fieldset style="border: 0; margin: 0; padding: 0;">
<legend style="font-size: 16px; font-weight: 600; margin-bottom: 10px;">Label stripe</legend>
<div id="edStripes" style="display: flex; flex-wrap: wrap; gap: 12px; padding-left: 4px;"></div>
</fieldset>
<button class="btn-ribbon" style="width: 100%;" type="submit">Save changes</button>
</form>
</aside>
</div>
</section>
<!-- Edit songs popup: the tape's receipt with a remove button on each song. -->
<div class="songs-overlay" hidden id="songsOverlay">
<div aria-labelledby="songsTitle" aria-modal="true" class="songs-dialog" role="dialog">
<div class="songs-head">
<h2 class="display" id="songsTitle">EDIT SONGS</h2>
<button aria-label="Close the song list" class="dialog-close" id="songsClose" type="button">×</button>
</div>
<div class="songs-body" id="songsReceipt"></div>
</div>
</div>
</div>
</section>
</main>
<!-- Pop-up message bar (see toast()) and the audio players used by the shared Player code. -->
<div aria-live="polite" id="toast" role="status"></div>
<audio id="deckAudio" preload="none"></audio>
<audio id="previewAudio" preload="none"></audio>
</div>
</div>
<!-- The editor's JavaScript, in js/. Plain scripts sharing one global scope, so the order matters:
     the four files shared with index.html first, then editor.js, which uses them. -->
<script src="js/helpers.js"></script>
<script src="js/store.js"></script>
<script src="js/artwork.js"></script>
<script src="js/ui.js"></script>
<script src="js/editor.js"></script>
</body>
</html>
